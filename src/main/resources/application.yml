server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: hoadiemcat-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    # Hỗ trợ kết nối Aiven Cloud MySQL qua DB_URL trực tiếp hoặc qua từng biến thành phần
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hoadiemcat_db}?createDatabaseIfNotExist=true&useSSL=${DB_SSL:false}&sslMode=${DB_SSL_MODE:PREFERRED}&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true

# JWT Security Properties
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:86400000}

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
